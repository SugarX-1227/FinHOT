# 实体库的人工部分（公开、入库）。股票清单本身由 `python -m finhot entities sync` 生成，见 finhot/entities.py。
#
# stocks：新闻里常见的别称、H 股 / 美股代码。键是 A 股代码（加引号，免得前导 0 丢掉）。
#   清单里没有这只股票时（比如种子清单），会用这里的 name 补上。
# generic：本身是常用词的简称。只有带代码、“简称：”开头，或后面紧跟“股份 / 公司 / 涨停 / 股价 / 公告”之类的词时，
#   才算点到这家公司（“机器人产业”不是在说 300024 机器人）。

stocks:
  "600519": {name: 贵州茅台, aliases: [茅台]}
  "300750": {name: 宁德时代, hk: 03750.HK}
  "002594": {name: 比亚迪, hk: 01211.HK, aliases: [比亚迪股份]}
  "688981": {name: 中芯国际, hk: 00981.HK}
  "601318": {name: 中国平安, hk: 02318.HK, aliases: [平安集团]}
