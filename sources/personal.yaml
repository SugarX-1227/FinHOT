# 个人简报、即时提醒的默认权重（公开配置，不含任何人的持仓）。每个人的画像在 profiles/<名字>.yaml（不入库）。
# 调标准改这里，不用动代码。见 docs/PERSONALIZATION.md。

# 关联强度：这条消息和你是什么关系（排序分 = 通用重要性 × 关联强度 × 点名方式 × 新鲜度）
relevance:
  持仓: 1.0
  自选: 0.8
  关联公司: 0.55      # 关系库里确认过的上游、下游、客户、供应商、竞品（只走一层）
  关注题材: 0.45
  同行业: 0.35
  宏观: 0.2

# 新闻里点到这家公司的方式（finhot/linker.py 的角色）
role_weights:
  主体: 1.0
  标题点名: 0.8
  信源关联: 0.5
  正文提及: 0.3
  行情名单: 0.25
  观点来源: 0.1
  中介: 0.1

# 这些点名方式算“顺带提到”：持仓、自选栏里不单列，每栏末尾合成一行“另有 N 条顺带提到”
weak_roles: [信源关联, 正文提及, 行情名单, 观点来源, 中介]

# 新鲜度：按发布了多久打折
freshness:
  - {hours: 12, factor: 1.0}
  - {hours: 24, factor: 0.8}
  - {hours: 72, factor: 0.5}

repeat_days: 3        # 同一件事几天内给过你就不再给（除非是新的公告，或者和之前给过的都不像）

# 简报每一栏最多几条；“关注题材”是每个题材几条
sections:
  持仓: 12
  自选: 8
  关联公司: 5
  关注题材: 3
  宏观: 5
min_rank: 0.8         # 排序分低于这个的不进简报（宏观段除外）

# 即时提醒（服务器上的推送进程里做）
push:
  min_rank: 5.0       # 持仓、自选的新闻：排序分到这个才即时提醒；公告看类型表里的 push
  move_pct: 5.0       # 持仓股盘中涨跌幅超过多少算异动（每只每天每个方向最多一次）
  daily_limit: 8      # 每人每天最多几条（画像里可以改）
  quiet: "22:30-07:30"
  announce_every: 300 # 每隔多少秒查一次持仓、自选的公告

# 反馈：按“有用 / 不相关 / 已知道”调各类理由的权重
feedback:
  learn: true
  min_labels: 5       # 一类理由至少有几条反馈才调
  bounds: [0.5, 1.5]
