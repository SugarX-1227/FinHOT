    name: 新“国九条”
    issuer: 国务院
    points: 《关于加强监管防范风险推动资本市场高质量发展的若干意见》，强监管与高质量发展并重
  - date: 2024-09-24
    name: 金融支持经济高质量发展一揽子政策
    issuer: 央行、金融监管总局、证监会
    points: 降准降息，创设证券、基金、保险公司互换便利和股票回购增持再贷款
