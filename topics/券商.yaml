    segments:
      - name: 经纪与财富管理
        what: 股票基金交易佣金、基金代销与投顾
        moat: 客户数与渠道；互联网券商获客成本低
        keywords: [经纪, 财富管理, 代销, 投顾]
        stocks:
          - {name: 东方财富, code: "300059", tier: 核心, note: 互联网券商 + 基金代销，成交额弹性最大的中军}
          - {name: 指南针, code: "300803", tier: 相关, note: 金融信息服务 + 麦高证券，弹性大}
      - name: 信用业务
        what: 融资融券、股票质押，赚利差
        moat: 资本金规模
        keywords: [融资融券, 信用业务]
        stocks: []
      - name: 自营投资
        what: 权益、固收、衍生品自营；2026 上半年占营收 43%
        moat: 投研与风控；结果随市场波动，被市场按周期利润打折
        keywords: [自营, 证券投资]
        stocks: []
      - name: 投行
        what: IPO、再融资、并购重组、债券承销
        moat: 项目储备与牌照资源，头部集中
        keywords: [投资银行, 承销, 保荐]
