# 题材档案 · 知识层（人工维护，程序只读）。字段说明见 topics/README.md。
name: 券商
slug: broker
aliases: [证券, 非银金融, 互联网券商, 牛市旗手]
updated: 2026-10-22
reviewed: false

one_liner: >-
  证券公司和相关的金融信息服务商。业绩跟着成交额、两融和指数走，股价对资本市场政策极其敏感，
  行情启动或政策转向时常率先上涨，所以叫“牛市旗手”；另一条线是券商并购重组带来的个股弹性。

boundary:
  includes:
    - A 股上市证券公司（约 50 家）
    - 互联网券商与金融信息服务（东方财富、同花顺、指南针等），弹性通常大于传统券商
  excludes:
    - 银行：同属大金融，但看利差和信贷，不看成交额
  related:
    - name: 非银金融（申万一级）
      diff: = 证券 + 保险 + 多元金融。本档案以券商为主，保险和交易所列在产业链末尾作对照
    - name: 保险
      diff: 看长端利率、权益市场和负债端保费，常与券商同涨同跌，但逻辑不同
    - name: 金融科技
      diff: 同花顺、东方财富既是金融信息服务也是券商相关，受成交额和散户活跃度驱动最明显

status:
  - text: 申万证券指数 2026 年上半年跌 7.92%，年初至 9-09 跌 11.69%，跑输上证指数约 11 个百分点
    url: https://www.huxiu.com/article/4889861.html
  - text: 上半年行业营收 3895 亿元、同比增 45%，净利润 1712.85 亿元、同比增约 49%；自营收入占营收 43%
    url: https://www.huxiu.com/article/4889861.html
  - text: 9-09 证券行业 PB 约 1.26 倍，处历史约 13% 分位，低于 2022—2023 年业绩低迷期
    url: https://www.huxiu.com/article/4889861.html
  - text: 上半年 A 股成交额约 317.5 万亿元、同比增约 95%；7—8 月日均约 2.48 万亿元，较上半年回落约 9.5%；两融余额从 6-25 高点 3.03 万亿元回落到 9-08 约 2.65 万亿元
    url: https://www.huxiu.com/article/4889861.html
  - text: 三季报前瞻：43 家上市券商三季度归母净利润同比约 +6%、环比约 -24%（机构预测）
    url: https://finance.eastmoney.com/a/202610203900546443.html

drivers:
  types: [政策, 成交额与情绪, 业绩, 并购重组]
  evidence: 业绩和政策都是实锤，但股价没有反映
  summary: >-
    券商是市场 beta 的放大器：成交额和两融决定经纪、信用业务，指数涨跌决定自营。2026 年业绩高增而股价下跌，
    市场把自营利润当周期利润打折。重新定价通常需要两样东西之一：成交额再次放大，或者超预期的政策。

