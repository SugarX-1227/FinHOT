          - {name: 华泰证券, code: "601688", tier: 核心, note: 机构推荐头部券商}
          - {name: 招商证券, code: "600999", tier: 相关, note: 机构称兼具估值修复与经营改善预期}
          - {name: 广发证券, code: "000776", tier: 相关, note: 机构称兼具估值修复与经营改善预期}
