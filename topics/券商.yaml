focus:
  - segment: 政策催化
    why: 10-19 金融街论坛：央行设立非银机构流动性支持工具，证监会表态支持券商并购重组、首批主动 ETF 注册、多层次市场改革
    url: https://www.21jingji.com/article/20261019/herald/6bddedf52d2b94cb5f432fe4a1f0d2fd.html
  - segment: 低估值修复
    why: PB 约 1.26 倍（历史 13% 分位），业绩高增而股价下跌；国金证券 10-22 称低估值券商板块性价比较高
    url: https://www.stcn.com/article/detail/4232312.html
  - segment: 头部集中
    why: 三季报前瞻称头部优势凸显，利润增速或优于行业
