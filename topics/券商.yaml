history:
  - window: 2023-07-25 前后
    trigger: 中央政治局会议提出“活跃资本市场”（7-24），次日券商大涨；8-27 印花税减半
    driver: 政策
    leaders: ""
    fade: 政策落地后成交额没有持续放大，行情很快回落
    verified: false
  - window: 2024-09-24 ~ 2024-10-08
    trigger: 924 一揽子政策 + 9-26 政治局会议“努力提振资本市场”；国泰君安与海通 9 月初宣布合并
    driver: 政策 + 成交额暴增
    leaders: 东方财富（中军）、指南针等互联网券商弹性最大
    fade: 10-08 成交额创纪录后见顶，随后宽幅震荡
    verified: false
  - window: 2025 全年
    trigger: 成交额和两融走高，券商并购潮（国泰君安合并海通、国联整合民生等）
    driver: 成交额 + 并购
    leaders: ""
    fade: 年初至 8 月底与上证同步，9 月后回落；截至 12-11 券商指数年内仅涨 2.11%，同期上证涨超 15%
    url: https://www.cs.com.cn/gppd/gsyj/202512/t20251212_6527869.html
    verified: true
  - window: 2026-01 ~ 2026-09
    trigger: 无板块级行情；业绩高增但股价下跌，年初至 9-09 跌 11.69%
    driver: 业绩与估值背离
    leaders: 少数业绩领先的中小券商（华安证券、长江证券）逆势上涨
    fade: ""
    url: https://www.huxiu.com/article/4889861.html
    verified: true

falsifiers:
  - 成交额继续萎缩、两融继续回落（7—8 月日均成交已较上半年回落约 9.5%）
  - 四季度自营继续拖累，业绩环比下滑（三季度前瞻环比约 -24%）
  - 并购重组只有表态没有新案例
  - 10-19 的流动性工具针对的是债市赎回风险，对权益市场的直接作用有限，政策预期落空

risks:
  - 券商定增、配股补资本（稀释）
  - 大股东减持、监管处罚、立案调查

