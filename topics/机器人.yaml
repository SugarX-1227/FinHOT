    driver: 海外映射 + 事件 + 政策
    leaders: 中军拓普集团、三花智控；丝杠、灵巧手方向弹性最大
    fade: ""
    verified: false
  - window: 2025-07 ~ 2025-09
    trigger: 智元机器人拟取得上纬新材控制权（2025-07-08），宇树启动上市辅导
    driver: 资本运作（本体借壳/上市预期）
    leaders: 上纬新材
    fade: ""
    verified: false
  - window: 2026-08
    trigger: 宇树科技 8-19 科创板上市，首日收盘较发行价涨约 460%
    driver: 事件（本体上市，估值锚）
    leaders: 宇树科技
    fade: ""
    url: https://www.news.cn/20260819/9cf9af5185ba4f93b5b6843b45fe9e2d/c.html
    verified: true
  - window: 2026-10 起
    trigger: 特斯拉称 Optimus V3 已为量产做好准备（10-19），10-20 涨停潮
    driver: 海外映射 + 产业趋势
    leaders: 当日 20cm 涨停有凡拓数创、赛摩智能、长盈精密，北交所嘉晨智能 30cm
    fade: 进行中
