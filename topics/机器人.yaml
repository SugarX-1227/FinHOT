name: 机器人
slug: robot
aliases: [人形机器人, 具身智能, 机器人概念]
updated: 2026-10-22
reviewed: false   # 你校对过后改成 true；未校对的档案卡顶部会提示

one_liner: >-
  能像人一样行走、操作的通用机器人。A股炒的主要是零部件供应链（关节执行器、丝杠、减速器、灵巧手、传感器），
  整机公司少；最大的外部催化是特斯拉 Optimus 的量产节奏，其次是国内本体公司上市和出货数据。

boundary:
  includes:
    - 人形机器人整机与核心零部件（执行器、丝杠、减速器、电机、灵巧手、传感器、结构件与材料）
    - 具身智能的“大脑、小脑”（模型、控制芯片）与四足机器人
  excludes:
    - 扫地机器人等消费电器：只是名字里有“机器人”
  related:
    - name: 工业机器人
      diff: 焊接、搬运机械臂，看制造业资本开支，是周期逻辑；和人形机器人共用减速器、伺服电机，所以常被一起炒
    - name: 具身智能
      diff: 更宽，含 AI 模型和非人形形态（四足、轮式、机械臂）；政策文件多用这个词
    - name: 特斯拉链 / 汽车零部件
      diff: 拓普、三花等本来是汽车零部件公司，人形机器人是第二增长曲线，股价同时受汽车业务影响

status:
  - text: 2026 年上半年全球人形机器人销量 3.6 万台，超过 2025 年全年的 3.5 万台；收入 5.4 亿美元，按收入计前五名都是中国企业（弗若斯特沙利文）
    url: https://m.21jingji.com/article/20261020/herald/02370b8a917b1b9dc3dd3b3d7d275850.html
  - text: 工信部：上半年人形机器人整机产品突破 400 款、产量超 4 万台，预计全年产量突破 10 万台
    url: https://m.21jingji.com/article/20261020/herald/02370b8a917b1b9dc3dd3b3d7d275850.html
  - text: 宇树科技 2026-08-19 登陆科创板，成为 A 股人形机器人第一股，发行价 150.80 元，首日收盘 845 元
    url: https://www.news.cn/20260819/9cf9af5185ba4f93b5b6843b45fe9e2d/c.html
  - text: 所处阶段：导入期（0→1）。券商判断 2026 年出货量从数千台跨向数万台，卡点在数据和算法
    url: https://m.21jingji.com/article/20261020/herald/02370b8a917b1b9dc3dd3b3d7d275850.html

drivers:
  types: [产业趋势, 海外映射, 政策]
  evidence: 预期为主，零部件订单开始兑现
  summary: >-
    主线是“量产临界点”：海外看特斯拉 Optimus V3 何时量产、量多大，国内看本体公司出货和上市。
    零部件公司的机器人收入目前占比普遍很小，股价炒的是未来定点和份额，所以对海外龙头的消息极其敏感。

policy:
  - date: 2023-11-02
    name: 《人形机器人创新发展指导意见》
    issuer: 工信部
    points: 到 2025 年初步建立创新体系、突破“大脑、小脑、肢体”关键技术；到 2027 年综合实力达到世界先进水平
    url: https://www.miit.gov.cn/zwgk/zcwj/wjfb/tz/art/2023/art_48fe01d562644aedb7ea3f4256df8190.html
  - date: 2025-03-05
    name: 2025 年政府工作报告
    issuer: 国务院
    points: 首次写入“具身智能”，列为培育的未来产业
    url: https://paper.people.com.cn/zgcsb/pc/content/202503/17/content_30062313.html
  - date: 2026-03
    name: “十五五”规划纲要
    issuer: 全国人大
    points: 推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等成为新的经济增长点
    url: https://www.ndrc.gov.cn/xwdt/spfg/mtjj/202604/t20260401_1404454.html
  - date: 2026-10-19
    name: 九部门推动前沿科技成果转化
    issuer: 九部门
    points: 加速脑机接口、具身智能等前沿科技成果向市场转化
    url: https://www.cls.cn/detail/2507952

