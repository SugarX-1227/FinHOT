chain:
  - stage: 上游 · 核心零部件
    segments:
      - name: 执行器总成（旋转、线性关节）
        what: 电机 + 减速器/丝杠 + 传感器集成的关节模组，单机价值量最大的部分
        moat: 系统集成能力和整机厂定点；谁进特斯拉、国内头部本体的供应链决定格局
        keywords: [执行器, 关节模组, 机器人关节]
        stocks:
          - {name: 拓普集团, code: "601689", tier: 核心, note: 特斯拉链，执行器总成（国金证券列为特斯拉链）}
          - {name: 三花智控, code: "002050", tier: 核心, note: 特斯拉链，执行器（国金证券列为特斯拉链）}
          - {name: 富临精工, code: "300432", tier: 相关, note: 10-20 公告拟 5 亿元投建机器人智能电关节项目}
      - name: 丝杠（行星滚柱、滚珠）
        what: 把旋转变成直线运动，线性关节的核心件
        moat: 磨削设备和工艺壁垒高，高端产品国产化率低，是弹性最大的环节之一
        keywords: [丝杠, 滚柱, 滚珠]
        stocks:
          - {name: 恒立液压, code: "601100", tier: 核心, note: 国泰海通推荐（核心零部件）}
          - {name: 五洲新春, code: "603667", tier: 相关, note: 轴承企业切入丝杠}
          - {name: 北特科技, code: "603009", tier: 相关, note: 汽车零部件企业切入丝杠}
      - name: 减速器（谐波、行星、RV）
        what: 降速增扭，旋转关节必需
        moat: 精度寿命与规模化成本；谐波减速器国产化程度较高
        keywords: [减速器, 谐波, 行星减速, RV]
        stocks:
          - {name: 绿的谐波, code: "688017", tier: 核心, note: 谐波减速器龙头；国泰海通推荐、国金列为长期优质格局}
          - {name: 双环传动, code: "002472", tier: 相关, note: 精密齿轮与减速器（国泰海通相关标的）}
          - {name: 中大力德, code: "002896", tier: 相关, note: 减速器与电机一体化}
      - name: 灵巧手与微型传动
        what: 手部多自由度执行机构，含微型电机、齿轮箱、腱绳
        moat: 自由度、负载与成本平衡；方案还在快速迭代
        keywords: [灵巧手, 微型传动, 微特电机]
        stocks:
          - {name: 兆威机电, code: "003021", tier: 核心, note: 微型传动与灵巧手；国泰海通推荐}
      - name: 电机与驱动
        what: 无框力矩电机、空心杯电机、驱动器与驱动芯片
        moat: 功率密度与控制算法；新技术方向有谐波磁场电机、GaN 驱动
        keywords: [无框力矩电机, 空心杯, 伺服, 驱动器, 电机]
        stocks:
          - {name: 步科股份, code: "688160", tier: 相关, note: 伺服与无框电机（国泰海通相关标的）}
          - {name: 鸣志电器, code: "603728", tier: 相关, note: 空心杯电机}
          - {name: 峰岹科技, code: "688279", tier: 相关, note: 电机驱动芯片（国泰海通相关标的）}
      - name: 传感器
        what: 六维力/力矩、触觉、关节编码器、3D 视觉
        moat: 精度与可靠性，高端力传感国产化低
        keywords: [力传感, 六维力, 触觉, 编码器, 3D视觉, 传感器]
        stocks:
          - {name: 奥比中光, code: "688322", tier: 核心, note: 3D 视觉；国金列为长期优质格局}
          - {name: 柯力传感, code: "603662", tier: 相关, note: 力传感器}
          - {name: 安培龙, code: "301413", tier: 相关, note: 压力与力传感器（国泰海通相关标的）}
      - name: 结构件与材料
        what: 精密结构件、轻量化材料（PEEK）、热管理
        moat: 精密制造与客户认证，壁垒相对低
        keywords: [精密零组件, 结构件, PEEK, 轻量化]
        stocks:
          - {name: 长盈精密, code: "300115", tier: 核心, note: 1-8 月交付超 110 万件人形机器人精密零组件；国泰海通推荐}
          - {name: 科达利, code: "002850", tier: 相关, note: 精密结构件（国泰海通相关标的）}
          - {name: 浙江荣泰, code: "603119", tier: 相关, note: 国泰海通相关标的}
          - {name: 宁波东力, code: "002164", tier: 相关, note: 国泰海通相关标的}
          - {name: 银轮股份, code: "002126", tier: 相关, note: 热管理；国金列为海外其他供应链}
  - stage: 中游 · 本体与大小脑
    segments:
      - name: 整机（本体）
        what: 设计与组装整机，掌握运动控制和场景落地
        moat: 运控算法、数据积累、规模化交付；A 股标的少，2026 年起陆续上市
        keywords: [人形机器人整机, 机器人本体, 四足机器人]
        stocks:
          - {name: 宇树科技, code: "", tier: 核心, note: 2026-08-19 科创板上市，A 股人形机器人第一股}
          - {name: 埃斯顿, code: "002747", tier: 相关, note: 工业机器人龙头，布局人形（国泰海通关注）}
          - {name: 上纬新材, code: "688585", tier: 相关, note: 智元机器人取得控制权后的上市平台}
      - name: 大脑与小脑
        what: 具身大模型、运动控制、端侧算力芯片
        moat: 数据与算法；A 股纯标的少，多在海外或未上市
        keywords: [具身智能大模型, 运动控制, 机器人芯片]
        stocks: []
  - stage: 下游 · 应用场景
    segments:
      - name: 制造、物流、商用与家庭
        what: 汽车与 3C 工厂、仓储搬运、导览教育、家庭服务，工信部称已在 300 多个重点场景验证部署
        moat: 场景数据与可靠性
        keywords: []
        stocks: []

