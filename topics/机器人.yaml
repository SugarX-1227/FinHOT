      次日（10-20）A 股人形机器人近 50 股涨停或涨超 10%。传导：当日到次日，最受益的是特斯拉链（执行器、丝杠、灵巧手）
    url: https://m.21jingji.com/article/20261020/herald/02370b8a917b1b9dc3dd3b3d7d275850.html
