falsifiers:
  - 特斯拉 V3 量产再延期，或年度股东大会（巴克莱预计最迟 12-06）没给出量产规模和供应商定点
  - 全年产量明显低于工信部预计的 10 万台；本体公司营收增速放缓（宇树 10-20 已提示“行业尚处于商业化早期”）
  - 零部件降价快于放量，供应商机器人业务毛利被压缩
  - 本体新股解禁、估值回落，拖累整个板块的估值锚

risks:
  - 澄清公告：零部件公司常发“机器人业务收入占比很小”的澄清，属于蹭概念信号
  - 异常波动公告、监管问询函、大股东减持

