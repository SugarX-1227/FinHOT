# 题材档案 · 知识层（人工维护，程序只读）。字段说明见 topics/README.md。
name: AI应用
slug: ai-app
aliases: [人工智能应用, AIGC, 智能体, AI Agent, 大模型应用]
updated: 2026-10-22
reviewed: false

one_liner: >-
  把大模型做成产品并收费的公司：办公、营销、内容、教育、医疗、金融 IT、企业软件里的 AI 功能和智能体。
  A 股炒的是“模型能力跃迁 → 应用放量”的预期，催化多来自海内外大模型发布；难点是收入兑现慢，多数公司 AI 收入占比很小。

boundary:
  includes:
    - 软件与互联网应用中的 AI 产品和智能体（办公、营销与广告、内容文娱、教育、医疗、金融 IT、企业软件）
    - 训练数据与语料提供商
  excludes:
    - 算力（芯片、服务器、光模块、液冷）：“卖铲子”的上游，FinHOT 单列为“算力”题材
    - AI 手机、AI 眼镜等端侧硬件：归消费电子
  related:
    - name: 算力
      diff: 上游；和应用常走跷跷板（9-04 GPT-6 Astra 发布次日硬件跌、应用涨，9-07 又反过来）
    - name: 大模型
      diff: 中游；A 股有自研模型的是科大讯飞、昆仑万维、三六零等，智谱、MiniMax 在港股
    - name: 数据要素 / 信创
      diff: 不少软件公司同时在这些概念里，催化不同

status:
  - text: 国务院《关于深入实施“人工智能+”行动的意见》：2027 年新一代智能终端、智能体等应用普及率超 70%，2030 年超 90%
    url: https://news.10jqka.com.cn/20250827/c670668652.shtml
  - text: 2026 年被多家券商称为“AI 应用元年”“智能体元年”，判断从技术验证转向商业推广
    url: https://finance.sina.com.cn/jjxw/2026-01-13/doc-inhhchmz9339131.shtml
  - text: 收入兑现仍少：2026 年 1 月炒作中，博瑞传播、引力传媒的 GEO 业务营收为零或尚未产生收入，蓝色光标 AI 相关收入占比较小
    url: https://finance.sina.com.cn/jjxw/2026-01-13/doc-inhhchmz9339131.shtml
  - text: 中国大模型调用量连续 24 周全球第一（10-12 报道）
    url: https://finance.sina.com.cn/7x24/2026-10-12/doc-iniuyarh0471202.shtml

drivers:
  types: [海外映射, 产业趋势, 政策]
  evidence: 预期为主，收入兑现少
  summary: >-
    每次重大模型发布（ChatGPT、Sora、DeepSeek、GPT-6）都会点燃一轮应用炒作，持续多久取决于收入能否跟上。
    资金常在“算力”和“应用”之间切换；模型发布当天应用涨、硬件跌的“叙事切换”往往只持续一两天。

