chain:
  - stage: 上游 · 数据与算力
    segments:
      - name: 数据与语料
        what: 训练数据采集标注、版权内容与语料
        moat: 数据版权与合规
        keywords: [数据标注, 语料, 训练数据, 数据服务]
        stocks:
          - {name: 海天瑞声, code: "688787", tier: 核心, note: 训练数据服务}
          - {name: 中文在线, code: "300364", tier: 相关, note: 网文版权与语料；2026-01 领涨“易中天”之一}
      - name: 算力
        what: 见 FinHOT“算力”题材，不在本档案展开
        moat: ""
        keywords: []
        stocks: []
  - stage: 中游 · 模型与平台
    segments:
      - name: 自研大模型与平台
        what: 通用或行业大模型、模型即服务
        moat: 模型能力与调用量；面临海内外头部模型的价格战
        keywords: [大模型, 模型平台]
        stocks:
          - {name: 科大讯飞, code: "002230", tier: 核心, note: 星火大模型；教育、医疗、政务落地}
          - {name: 昆仑万维, code: "300418", tier: 核心, note: 天工大模型与海外 AI 应用；2026-01 20cm}
          - {name: 三六零, code: "601360", tier: 相关, note: 自研模型与安全}
  - stage: 下游 · 场景应用
    segments:
      - name: 办公与协同
        what: 文档、表格、PDF 中的 AI 功能，按订阅收费
        moat: 用户基数与付费习惯；看 AI 订阅收入占比和续费率
        keywords: [办公软件, 文档, PDF, 协同]
        stocks:
          - {name: 金山办公, code: "688111", tier: 核心, note: WPS AI；订阅制，收入兑现最直接}
          - {name: 福昕软件, code: "688095", tier: 相关, note: PDF 与文档 AI}
      - name: 营销与广告（含 GEO）
        what: AI 生成素材、投放优化、生成式引擎优化（GEO）
        moat: 客户资源；AI 收入占比普遍小
        keywords: [营销, 广告, 数字营销, 投放]
        stocks:
          - {name: 蓝色光标, code: "300058", tier: 核心, note: 2026-01 20cm；AI 相关收入占比较小}
          - {name: 易点天下, code: "301171", tier: 相关, note: 2026-01“易中天”之一，9-04 大涨超 10%}
          - {name: 天龙集团, code: "300063", tier: 相关, note: 2026-01“易中天”之一}
          - {name: 引力传媒, code: "603598", tier: 相关, note: 2026-01 六天五板，GEO 尚未产生收入}
      - name: 内容与文娱
        what: AI 视频、短剧、游戏、数字人
        moat: IP 与内容储备
        keywords: [影视, 短剧, 游戏, 视频, 数字人]
        stocks:
          - {name: 万兴科技, code: "300624", tier: 相关, note: AI 视频创意软件}
          - {name: 天娱数科, code: "002354", tier: 相关, note: 9-04 涨停}
      - name: 金融 IT
        what: 银行、券商的软件与智能体，数字货币与跨境支付
        moat: 金融客户资质
        keywords: [银行IT, 金融科技, 金融软件, 支付]
        stocks:
          - {name: 四方精创, code: "300468", tier: 相关, note: 9-04 20cm（金融科技与数字货币同时催化）}
          - {name: 宇信科技, code: "300674", tier: 相关, note: 9-04 跟涨}
          - {name: 科蓝软件, code: "300663", tier: 相关, note: 9-04 跟涨}
      - name: 企业软件与智能体
        what: ERP、CRM 等企业软件里的智能体
        moat: 企业客户与流程数据
        keywords: [ERP, 企业管理软件, 智能体, 云服务]
        stocks:
          - {name: 用友网络, code: "600588", tier: 核心, note: 企业软件龙头；看 AI 订单与项目毛利}
          - {name: 汉得信息, code: "300170", tier: 相关, note: 企业软件实施}
      - name: 医疗与教育
        what: AI 问诊、医院信息化、学习机与教育应用
        moat: 场景准入与数据
        keywords: [医疗信息化, 医疗, 教育, 学习机]
        stocks:
          - {name: 卫宁健康, code: "300253", tier: 相关, note: 医疗信息化；2026-01 ChatGPT Health 带动 AI 医疗方向}

