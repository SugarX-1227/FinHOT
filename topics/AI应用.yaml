    fade: ""
    verified: false
  - window: 2024-02 ~ 2024-03
    trigger: OpenAI 发布 Sora（2-16），Kimi 长文本走红（3 月）
    driver: 海外映射 + 国产模型
    leaders: ""
    fade: ""
    verified: false
  - window: 2025-02 ~ 2025-03
    trigger: DeepSeek-R1 发布（1-20）后春节后爆发；Manus 带火智能体（3 月）
    driver: 国产模型突破
    leaders: ""
    fade: ""
    verified: false
  - window: 2026-01
    trigger: 智谱、MiniMax 登陆港股，OpenAI 推出 ChatGPT Health（1-08）；1-12 板块全线爆发
    driver: 海外映射 + 港股映射
    leaders: 蓝色光标、易点天下、中文在线、昆仑万维 20cm；引力传媒六天五板；易点天下、中文在线、天龙集团被称为新“易中天”
    fade: 多家公司澄清 GEO 收入为零或尚未产生收入
    url: https://finance.sina.com.cn/jjxw/2026-01-13/doc-inhhchmz9339131.shtml
    verified: true
  - window: 2026-09-04 ~ 09-07
    trigger: OpenAI 发布 GPT-6 Astra（9-03）
    driver: 海外映射 + 工信部应用服务商政策
    leaders: 天娱数科、翠微股份、楚天龙涨停，四方精创 20cm
    fade: 9-07 硬件反弹、软件回落，“软硬切换”只持续一个交易日
    url: https://www.tmtpost.com/8130901.html
    verified: true

falsifiers:
  - 收入兑现不及预期，公司澄清“相关收入为零或占比很小”（2026-01 已多次出现）
  - 基础模型厂商自己做应用，挤压第三方应用公司的利润
  - 模型发布引发的“软硬切换”只持续一两天就反转
  - 海外监管与禁令升级

risks:
  - 澄清公告、异常波动公告
  - 减持、亏损扩大

calendar:
  - date: 2026-10-31
    event: 三季报披露截止，看 AI 收入占比、订阅收入与订单

