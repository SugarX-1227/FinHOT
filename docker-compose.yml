# FinHOT 一键部署：网站引擎（web/ 里的 db、setup、api、worker、web）+ 快讯推送进程（pusher）。
# 配置只有一份：web/.env（deploy/finhot.sh init 生成）。日常用 deploy/finhot.sh 操作，等价于：
#   docker compose --env-file web/.env up -d --build
# 部署步骤见 docs/SERVER_SETUP.md。
name: finhot

include:
  - web/docker-compose.yml

services:
  pusher:
    build: .
    image: finhot-pusher
    restart: unless-stopped
    environment:
      FINHOT_ENGINE_URL: http://api:3001
      INGEST_TOKEN: ${INGEST_TOKEN:?请在 web/.env 里设置 INGEST_TOKEN}
      FINHOT_PUSH_MIN_SCORE: ${FINHOT_PUSH_MIN_SCORE:-6}
      FINHOT_PUSH_MAX_PER_EVENT: ${FINHOT_PUSH_MAX_PER_EVENT:-4}
      FINHOT_PUSH_INTERVAL: ${FINHOT_PUSH_INTERVAL:-90}
      FINHOT_PUSH_SOURCES: ${FINHOT_PUSH_SOURCES:-}
      # 盘面任务写一句话涨停原因用的模型，和网站用同一个（不填就只用规则）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BODY_EXTRA: ${LLM_EXTRA_JSON:-}
      LLM_TRUST_ENV: "0"
      # 个性化（docs/PERSONALIZATION.md）：画像在仓库目录的 profiles/（不入库），个人数据（简报、推送记录、反馈）
      # 在数据卷的 private/；仓库里公开的 data/ 只读挂进来（关系归纳、我的周报要用）
      FINHOT_PROFILES_DIR: /app/profiles
      FINHOT_PRIVATE_DIR: /app/data/private
      FINHOT_PUBLIC_DATA_DIR: /app/public-data
      # 反馈链接（可选）：FINHOT_FEEDBACK_SECRET 至少 16 位；FINHOT_FEEDBACK_URL 是外面访问这台服务器 8790 端口的地址
      FINHOT_FEEDBACK_SECRET: ${FINHOT_FEEDBACK_SECRET:-}
      FINHOT_FEEDBACK_URL: ${FINHOT_FEEDBACK_URL:-}
      FINHOT_FEEDBACK_PORT: "8790"
    volumes:
      - pusher:/app/data
      - ./profiles:/app/profiles
      - ./data:/app/public-data:ro
    ports:
      # 默认只绑本机：不开反馈链接时外面连不上。开的时候在 web/.env 里设 FINHOT_FEEDBACK_BIND=0.0.0.0（见 SERVER_SETUP.md）
      - "${FINHOT_FEEDBACK_BIND:-127.0.0.1}:8790:8790"
    depends_on:
      api:
        condition: service_started

volumes:
  pusher: {}
