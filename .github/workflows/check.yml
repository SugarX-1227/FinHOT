name: check

on:
  push:
    paths-ignore: ["reports/**", "data/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Source health check
        run: python -m finhot sources
      - name: Smoke run (no LLM, last 6h)
        run: |
          python -m finhot run --no-llm --hours 6 --out "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out/latest.md"
      - name: Weekly + site smoke
        run: |
          python -m finhot weekly --no-llm --out "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out/weekly/latest.md"
          python -m finhot site --out "$RUNNER_TEMP/out/site"
          ls "$RUNNER_TEMP/out/site" "$RUNNER_TEMP/out/site/daily" | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: ${{ runner.temp }}/out
